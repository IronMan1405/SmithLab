name: Bug report
description: Something is wrong, inaccurate or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please report security issues privately instead; see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: expressions
    attributes:
      label: Expressions
      description: Paste the expression rows involved, one per line. They are usually enough to reproduce the problem.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Any chart interactions needed (dragging, sliders, coordinate mode, Z₀, zoom).
      placeholder: |
        1. Paste the expressions above
        2. Switch Coords to Y
        3. …
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mathematics or results (wrong value, type or geometry)
        - Chart drawing
        - Expression panel or reference
        - Interaction (dragging, sliders, keyboard, pan/zoom)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 142 on macOS 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SmithLab version or commit
      placeholder: e.g. 0.9.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other context
